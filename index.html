<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EE สป69/16" />
  <title>เทคโนโลยีไฟฟ้า สป69/16 — แผนการเรียนและตารางสอน</title>
  <link id="apple-touch-icon-link" rel="apple-touch-icon" sizes="512x512" />
  <link id="favicon-link" rel="icon" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #07090d;
      --surface: #0e1219;
      --surface-2: #141a24;
      --surface-3: #1b2330;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --ink: #f4f6fa;
      --ink-sub: #9aa5b8;
      --ink-dim: #626d82;
      --volt: #f59e0b;
      --volt-bright: #fbbf24;
      --volt-soft: rgba(245, 158, 11, 0.14);
      --volt-line: rgba(245, 158, 11, 0.45);
      --ok: #10b981;
      --ok-soft: rgba(16, 185, 129, 0.14);
      --warn: #eab308;
      --warn-soft: rgba(234, 179, 8, 0.14);
      --bad: #ef4444;
      --bad-soft: rgba(239, 68, 68, 0.14);
      --sans: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --top-inset: env(safe-area-inset-top, 0px);
      --bot-inset: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(ellipse 95% 36% at 50% -4%, rgba(245, 158, 11, 0.16), transparent 72%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      padding-bottom: calc(96px + var(--bot-inset));
    }

    .mono { font-family: var(--mono); }
    .hidden { display: none !important; }
    .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      padding-top: var(--top-inset);
      background: rgba(7, 9, 13, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(150deg, rgba(245, 158, 11, 0.24), rgba(20, 26, 36, 0.96));
      border: 1px solid var(--volt-line);
      color: var(--volt-bright);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .tag-pill {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--volt-bright);
      background: var(--volt-soft);
      border: 1px solid var(--volt-line);
      padding: 1px 7px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--ink-sub);
    }

    .ghost-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
    }

    .ghost-btn:hover {
      background: var(--surface-3);
      border-color: var(--volt-line);
    }

    .ghost-btn:active { transform: scale(0.97); }

    /* Container & Spacing */
    .shell {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stack-sm {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 17px;
    }

    .panel-active {
      border-color: var(--volt-line);
      background: linear-gradient(155deg, rgba(245, 158, 11, 0.13), var(--surface) 58%);
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .row-gap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (min-width: 480px) {
      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    /* Typography & KPI */
    .kicker {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-sub);
    }

    .kpi-num {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .kpi-denom {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-dim);
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      margin: 0;
    }

    .hint {
      font-size: 11.5px;
      color: var(--ink-dim);
    }

    /* Progress Bar */
    .bar-track {
      height: 7px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--volt), var(--volt-bright));
      transition: width 0.3s ease;
    }

    /* Status Filter Tiles */
    .status-tile {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      font-family: var(--sans);
      transition: border-color 0.14s ease, transform 0.12s ease, background 0.14s ease;
    }

    .status-tile:hover {
      border-color: var(--line-strong);
      background: var(--surface-2);
    }

    .status-tile:active { transform: scale(0.98); }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .dot-ok { background: var(--ok); }
    .dot-warn { background: var(--warn); }
    .dot-idle { background: var(--ink-dim); }
    .dot-bad { background: var(--bad); }

    .tile-val {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 8px;
      line-height: 1.1;
    }

    .tile-lbl {
      font-size: 11.5px;
      color: var(--ink-sub);
      margin-top: 3px;
    }

    /* Term Bars */
    .term-row {
      display: grid;
      grid-template-columns: 64px 1fr 44px;
      align-items: center;
      gap: 11px;
      padding: 7px 8px;
      margin: 0 -8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.14s ease;
    }

    .term-row:hover { background: var(--surface-2); }

    .term-mini-track {
      height: 6px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
    }

    .term-mini-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--volt);
    }

    /* Filter Chips & Search */
    .search-box {
      position: relative;
    }

    .input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.14s ease, background 0.14s ease;
    }

    .input:focus {
      border-color: var(--volt-bright);
      background: var(--surface-3);
    }

    .chip-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .chip-strip::-webkit-scrollbar { display: none; }

    .chip {
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-sub);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .chip.active {
      background: var(--volt-soft);
      border-color: var(--volt-line);
      color: var(--volt-bright);
    }

    /* Course & Teacher Cards */
    .card-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--line-strong);
      border-radius: 15px;
      padding: 15px 16px;
      cursor: pointer;
      transition: border-color 0.14s ease, transform 0.12s ease, background 0.14s ease;
    }

    .card-item:hover {
      border-color: var(--line-strong);
      background: var(--surface-2);
    }

    .card-item:active { transform: scale(0.988); }
    .card-item.st-passed { border-left-color: var(--ok); }
    .card-item.st-active { border-left-color: var(--volt-bright); }
    .card-item.st-failed { border-left-color: var(--bad); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge-passed { background: var(--ok-soft); color: #34d399; border-color: rgba(16, 185, 129, 0.28); }
    .badge-active { background: var(--volt-soft); color: var(--volt-bright); border-color: var(--volt-line); }
    .badge-idle { background: rgba(148, 163, 184, 0.1); color: var(--ink-sub); border-color: rgba(148, 163, 184, 0.2); }
    .badge-failed { background: var(--bad-soft); color: #f87171; border-color: rgba(239, 68, 68, 0.28); }

    .card-meta {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-sub);
    }

    /* Large Teacher Portraits in Timetable */
    .portrait-single {
      width: 82px;
      height: 82px;
      border-radius: 15px;
      object-fit: cover;
      object-position: top center;
      border: 1px solid var(--volt-line);
      background: var(--surface-3);
      display: block;
      flex-shrink: 0;
    }

    .portrait-pair {
      width: 66px;
      height: 66px;
      border-radius: 13px;
      object-fit: cover;
      object-position: top center;
      border: 1px solid var(--volt-line);
      background: var(--surface-3);
      display: block;
      flex-shrink: 0;
    }

    .portrait-btn {
      position: relative;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 15px;
      display: inline-block;
      transition: transform 0.14s ease;
    }

    .portrait-btn:active { transform: scale(0.95); }

    .portrait-edit-tag {
      position: absolute;
      right: 4px;
      bottom: 4px;
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(7, 9, 13, 0.86);
      color: var(--volt-bright);
      border: 1px solid var(--volt-line);
    }

    .teacher-thumb {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      object-fit: cover;
      object-position: top center;
      border: 1px solid var(--line-strong);
      background: var(--surface-3);
      flex-shrink: 0;
    }

    /* Primary & Secondary Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 15px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .btn:hover { background: var(--surface-3); }
    .btn:active { transform: scale(0.98); }

    .btn-volt {
      background: var(--volt);
      border-color: var(--volt-bright);
      color: #090b0f;
      font-weight: 700;
    }

    .btn-volt:hover {
      background: var(--volt-bright);
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 10px;
    }

    /* Bottom Navigation */
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding-bottom: var(--bot-inset);
      background: rgba(7, 9, 13, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
    }

    .nav-inner {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 7px 4px;
      border: 0;
      background: transparent;
      color: var(--ink-dim);
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 600;
      border-radius: 11px;
      cursor: pointer;
      transition: color 0.14s ease, background 0.14s ease;
    }

    .nav-btn.active {
      color: var(--volt-bright);
      background: var(--volt-soft);
    }

    /* Bottom Sheet Modal with Spacious iPhone Form Spacing */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border-top: 1px solid var(--line-strong);
      border-radius: 22px 22px 0 0;
      padding: 22px 20px calc(30px + var(--bot-inset));
    }

    .sheet-section {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .sheet-field {
      margin-top: 14px;
    }

    .sheet-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-sub);
      margin-bottom: 7px;
    }

    .sheet-input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13.5px;
      outline: none;
    }

    .sheet-input:focus {
      border-color: var(--volt-bright);
      background: var(--surface-3);
    }

    .grade-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-top: 10px;
    }

    .grade-btn {
      padding: 10px 6px;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .grade-btn.active {
      background: var(--volt);
      border-color: var(--volt-bright);
      color: #090b0f;
    }

    /* Toast Message */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(82px + var(--bot-inset));
      transform: translateX(-50%);
      z-index: 60;
      max-width: 90vw;
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--surface-3);
      border: 1px solid var(--volt-line);
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
    }

    .icon-preview-box {
      width: 84px;
      height: 84px;
      border-radius: 19px;
      overflow: hidden;
      border: 1px solid var(--volt-line);
      flex-shrink: 0;
    }

    .icon-preview-box img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
        </div>
        <div style="min-width:0;">
          <div class="brand-title">
            <span class="ellipsis">เทคโนโลยีไฟฟ้า</span>
            <span class="tag-pill">สป69/16</span>
          </div>
          <div class="brand-sub ellipsis">มรภ.ธนบุรี (สมุทรปราการ) · ภาคพิเศษวันอาทิตย์</div>
        </div>
      </div>
      <button class="ghost-btn" data-action="quick-timetable" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        <span>ตารางเรียน</span>
      </button>
    </div>
  </header>

  <main class="shell">
    <section id="view-overview" class="stack" data-view="overview"></section>
    <section id="view-plan" class="stack hidden" data-view="plan"></section>
    <section id="view-schedule" class="stack hidden" data-view="schedule"></section>
    <section id="view-teachers" class="stack hidden" data-view="teachers"></section>
  </main>

  <nav class="nav" aria-label="นำทางหลัก">
    <div class="nav-inner">
      <button class="nav-btn active" data-tab="overview" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        <span>ภาพรวม</span>
      </button>
      <button class="nav-btn" data-tab="plan" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        <span>แผนการเรียน</span>
      </button>
      <button class="nav-btn" data-tab="schedule" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        <span>ตารางอาทิตย์</span>
      </button>
      <button class="nav-btn" data-tab="teachers" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>อาจารย์</span>
      </button>

    function svgAvatarDataUrl(teacher) {
      const idx = Math.max(0, FACULTY.findIndex(t => t.id === teacher.id));
      const tones = ['#f59e0b', '#38bdf8', '#34d399', '#a78bfa', '#fb7185', '#fbbf24'];
      const accent = tones[idx % tones.length];
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
        <rect width="240" height="240" fill="#141a24"/>
        <circle cx="120" cy="88" r="42" fill="#263142" stroke="${accent}" stroke-width="3"/>
        <path d="M44 216c0-40 34-66 76-66s76 26 76 66" fill="#263142" stroke="${accent}" stroke-width="3"/>
        <rect x="18" y="198" width="204" height="26" rx="8" fill="#090c10" fill-opacity="0.82"/>
        <text x="120" y="215" text-anchor="middle" fill="#f4f6fa" font-family="sans-serif" font-size="12" font-weight="700">${escapeXml(teacher.name.slice(0, 22))}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function escapeXml(str) {
      return String(str || '').replace(/[<>&'"]/g, ch => ({
        '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;'
      }[ch]));
    }

    function getTeacherPortraitSrc(teacher) {
      if (state.photos[teacher.id]) return state.photos[teacher.id];
      if (state.bundledPhotos[teacher.id]) return state.bundledPhotos[teacher.id];
      return svgAvatarDataUrl(teacher);
    }

    function resolveTeachersForCourse(course) {
      const raw = (course.teacher || '').split(',').map(s => s.trim()).filter(Boolean);
      return raw.map(name => {
        const matched = FACULTY.find(t => t.name === name || name.includes(t.name.replace(/^อ\.|^ผศ\.\s*ว่าที่ร้อยตรี\s*ดร\.|^ผศ\.|^อ\.\s*ดร\./, '').trim()));
        return matched || { id: 'custom_' + name, name, role: 'อาจารย์ผู้สอน' };
      });
    }

    function hydrate() {
      const freshCourses = JSON.parse(JSON.stringify(INITIAL_COURSES));
      let saved = null;

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) saved = JSON.parse(raw);
      } catch (e) {}

      if (saved && Array.isArray(saved.courses)) {
        const savedMap = new Map(saved.courses.map(c => [c.code, c]));
        state.courses = freshCourses.map(base => {
          const item = savedMap.get(base.code);
          return item ? { ...base, ...item } : base;
        });
        state.photos = saved.photos && typeof saved.photos === 'object' ? { ...saved.photos } : {};
      } else {
        state.courses = freshCourses;
        state.photos = {};
      }

      for (const k of LEGACY_KEYS) {
        try {
          const legacyRaw = localStorage.getItem(k);
          if (!legacyRaw) continue;
          const parsed = JSON.parse(legacyRaw);
          if (parsed && parsed.photos && typeof parsed.photos === 'object') {
            for (const [tid, src] of Object.entries(parsed.photos)) {
              if (!state.photos[tid] && typeof src === 'string' && src.startsWith('data:image/')) {
                state.photos[tid] = src;
              }
            }
          }
        } catch (e) {}
      }

      persist();
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          courses: state.courses,
          photos: state.photos
        }));
      } catch (e) {}
    }

    async function loadBundledImage(url) {
      if (bundledImageCache.has(url)) return bundledImageCache.get(url);
      const promise = new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
      bundledImageCache.set(url, promise);
      return promise;
    }

    async function probeBundledFacultyPhotos() {
      const exts = ['jpg', 'jpeg', 'png', 'webp'];
      let updated = false;
      for (const t of FACULTY) {
        for (const ext of exts) {
          const candidate = `${t.id}.${ext}`;
          const img = await loadBundledImage(candidate);
          if (img) {
            state.bundledPhotos[t.id] = candidate;
            updated = true;
            break;
          }
        }
      }
      if (updated) render();
    }

    function buildAppIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, 512, 512);
      bg.addColorStop(0, '#141923');
      bg.addColorStop(1, '#07090d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 512, 512);

      // Calendar timetable card body
      ctx.fillStyle = '#0e131c';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 6;
      roundRect(ctx, 64, 86, 384, 344, 36);
      ctx.fill();
      ctx.stroke();

      // Header band
      ctx.fillStyle = '#f59e0b';
      roundRect(ctx, 64, 86, 384, 88, 36);
      ctx.fill();
      ctx.fillRect(64, 138, 384, 36);

      // Calendar rings
      ctx.fillStyle = '#f8fafc';
      roundRect(ctx, 142, 54, 24, 54, 12);
      ctx.fill();
      roundRect(ctx, 346, 54, 24, 54, 12);
      ctx.fill();

      // Header text
      ctx.fillStyle = '#090b0f';
      ctx.font = '700 32px "IBM Plex Sans Thai", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ตารางเรียน · EE', 256, 141);

      // Timetable blocks grid
      const cols = [94, 198, 302];
      const rows = [202, 268, 334];
      const blockColors = [
        ['rgba(245,158,11,0.35)', 'rgba(16,185,129,0.28)', 'rgba(148,163,184,0.14)'],
        ['rgba(245,158,11,0.22)', 'rgba(245,158,11,0.45)', 'rgba(148,163,184,0.14)'],
        ['rgba(16,185,129,0.25)', 'rgba(148,163,184,0.14)', 'rgba(245,158,11,0.28)']
      ];

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          ctx.fillStyle = blockColors[r][c];
          roundRect(ctx, cols[c], rows[r], 116, 48, 10);
          ctx.fill();
        }
      }

      // Bottom cohort badge
      ctx.fillStyle = '#fbbf24';
      ctx.font = '700 24px "JetBrains Mono", monospace';
      ctx.fillText('สป69/16', 256, 412);

      appIconUrl = canvas.toDataURL('image/png');
      const appleLink = document.getElementById('apple-touch-icon-link');
      const favLink = document.getElementById('favicon-link');
      if (appleLink) appleLink.href = appIconUrl;
      if (favLink) favLink.href = appIconUrl;
    }

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function computeStats() {
      const transferredCr = TRANSFERRED.reduce((sum, item) => sum + item.cr, 0);
      const passedCourses = state.courses.filter(c => c.status === 'passed');
      const activeCourses = state.courses.filter(c => c.status === 'active');
      const idleCourses = state.courses.filter(c => c.status === 'idle');
      const failedCourses = state.courses.filter(c => c.status === 'failed');

      const passedCr = passedCourses.reduce((sum, c) => sum + Number(c.cr || 0), 0);
      const totalCredits = transferredCr + passedCr;
      const targetCredits = 122;

      let gpPoints = 0;
      let gpCredits = 0;
      for (const c of passedCourses) {
        if (c.grade && Object.prototype.hasOwnProperty.call(GRADE_POINTS, c.grade)) {
          const cr = Number(c.cr || 0);
          gpPoints += GRADE_POINTS[c.grade] * cr;
          gpCredits += cr;
        }
      }
      const gpax = gpCredits > 0 ? (gpPoints / gpCredits).toFixed(2) : '0.00';

      return {
        transferredCount: TRANSFERRED.length,
        transferredCr,
        passedCount: passedCourses.length,
        passedCr,
        activeCount: activeCourses.length,
        idleCount: idleCourses.length,
        failedCount: failedCourses.length,
        totalCredits,
        targetCredits,
        pct: Math.min(100, Math.round((totalCredits / targetCredits) * 100)),
        gpax,
        gpCredits
      };
    }

    function statusMeta(course) {
      if (course.status === 'passed') {
        const gLabel = course.grade ? ` · ${course.grade}` : '';
        return { cls: 'badge-passed', text: `เรียนผ่านแล้ว${gLabel}` };
      }
      if (course.status === 'active') {
        const extra = course.note ? ` · ${course.note}` : '';
        return { cls: 'badge-active', text: `กำลังเรียน${extra}` };
      }
      if (course.status === 'failed') {
        return { cls: 'badge-failed', text: 'ไม่ผ่าน / W' };
      }
      return { cls: 'badge-idle', text: 'ยังไม่เรียน' };
    }

        <div class="sheet-section">
          <span class="sheet-label">สถานะรายวิชา</span>
          <div class="grid-2" style="margin-top:8px;">
            ${statuses.map(([val, lbl]) => `
              <button class="btn ${course.status === val ? 'btn-volt' : ''}" data-pick-status="${val}" type="button">${lbl}</button>
            `).join('')}
          </div>

          <div style="margin-top:16px;">
            <span class="sheet-label">ผลการเรียน (เกรดสำหรับคำนวณ GPAX)</span>
            <div class="grade-grid">
              ${grades.map(g => `
                <button class="grade-btn ${course.grade === g ? 'active' : ''}" data-pick-grade="${g}" type="button">${g}</button>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="sheet-section">
          <div class="section-title">รายละเอียดตารางเรียนวันอาทิตย์</div>

          <div class="sheet-field">
            <label class="sheet-label" for="f-days">วันอาทิตย์ที่เรียน</label>
            <input id="f-days" class="sheet-input" type="text" value="${escapeHtmlAttr(course.days)}" placeholder="เช่น 14, 21, 28 มิ.ย. / 5, 12 ก.ค. 69" />
          </div>

          <div class="grid-2 sheet-field">
            <div>
              <label class="sheet-label" for="f-start">เวลาเริ่ม</label>
              <input id="f-start" class="sheet-input mono" type="text" value="${escapeHtmlAttr(course.start)}" placeholder="07:00" />
            </div>
            <div>
              <label class="sheet-label" for="f-end">เวลาเลิก</label>
              <input id="f-end" class="sheet-input mono" type="text" value="${escapeHtmlAttr(course.end)}" placeholder="19:00" />
            </div>
          </div>

          <div class="grid-2 sheet-field">
            <div>
              <label class="sheet-label" for="f-room">ห้องเรียน</label>
              <input id="f-room" class="sheet-input" type="text" value="${escapeHtmlAttr(course.room)}" placeholder="สป13-302" />
            </div>
            <div>
              <label class="sheet-label" for="f-section">หมู่เรียน</label>
              <input id="f-section" class="sheet-input" type="text" value="${escapeHtmlAttr(course.section)}" placeholder="หมู่ 30" />
            </div>
          </div>

          <div class="sheet-field">
            <label class="sheet-label" for="f-teacher">อาจารย์ผู้สอน</label>
            <input id="f-teacher" class="sheet-input" type="text" list="faculty-datalist" value="${escapeHtmlAttr(course.teacher)}" placeholder="ระบุชื่ออาจารย์ (คั่นด้วยจุลภาคหากสอนคู่)" />
            <datalist id="faculty-datalist">
              ${FACULTY.map(t => `<option value="${escapeHtmlAttr(t.name)}"></option>`).join('')}
            </datalist>
          </div>

          <div class="sheet-field">
            <label class="sheet-label" for="f-note">หมายเหตุ</label>
            <input id="f-note" class="sheet-input" type="text" value="${escapeHtmlAttr(course.note)}" placeholder="เช่น กำลังส่งเกรด / สอบปลายภาค" />
          </div>

          <div style="display:flex;gap:10px;margin-top:22px;">
            <button class="btn" style="flex:1;" data-close-modal type="button">ยกเลิก</button>
            <button class="btn btn-volt" style="flex:2;" data-save-course type="button">บันทึกข้อมูล</button>
          </div>
        </div>
      `;

      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      state.editingCourseCode = null;
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function saveCourseFromModal() {
      const course = state.courses.find(c => c.code === state.editingCourseCode);
      if (!course) return;

      course.days = (document.getElementById('f-days')?.value || '').trim();
      course.start = (document.getElementById('f-start')?.value || '').trim();
      course.end = (document.getElementById('f-end')?.value || '').trim();
      course.room = (document.getElementById('f-room')?.value || '').trim();
      course.section = (document.getElementById('f-section')?.value || '').trim();
      course.teacher = (document.getElementById('f-teacher')?.value || '').trim();
      course.note = (document.getElementById('f-note')?.value || '').trim();

      persist();
      closeModal();
      render();
      showToast(`บันทึก ${course.code} แล้ว`);
    }

    function handlePhotoFileSelected(file) {
      const teacherId = state.pendingPhotoTeacherId;
      if (!file || !teacherId) return;

      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxSide = 480;
          const ratio = Math.min(1, maxSide / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * ratio));
          canvas.height = Math.max(1, Math.round(img.height * ratio));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          state.photos[teacherId] = canvas.toDataURL('image/jpeg', 0.84);
          persist();
          render();
          showToast('อัปเดตรูปอาจารย์เรียบร้อย');
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    async function exportSchedulePng() {
      const term = state.scheduleTerm;
      const items = state.courses.filter(c => c.term === term && (c.days || c.start || c.teacher || c.room));
      if (!items.length) {
        showToast('ไม่มีรายวิชาที่มีตารางเรียนในเทอมนี้');
        return;
      }

      showToast('กำลังสร้างรูปตารางเรียน PNG...');

      const loadedImgs = new Map();
      for (const course of items) {
        for (const t of resolveTeachersForCourse(course)) {
          const src = getTeacherPortraitSrc(t);
          if (!loadedImgs.has(src)) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            await new Promise(res => {
              img.onload = () => res(img);
              img.onerror = () => res(null);
              img.src = src;
            });
            loadedImgs.set(src, img.complete && img.naturalWidth ? img : null);
          }
        }
      }

      const width = 1080;
      const rowHeight = 172;
      const headerHeight = 190;
      const footerHeight = 90;
      const height = headerHeight + items.length * rowHeight + footerHeight;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#07090d';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#f59e0b';
      ctx.font = '700 22px "JetBrains Mono", monospace';
      ctx.fillText('DRU ELECTRICAL TECHNOLOGY · สป69/16', 54, 66);

      ctx.fillStyle = '#f4f6fa';
      ctx.font = '700 38px "IBM Plex Sans Thai", sans-serif';
      ctx.fillText(`ตารางเรียนวันอาทิตย์ · ภาคเรียนที่ ${term}`, 54, 118);

      ctx.fillStyle = '#9aa5b8';
      ctx.font = '500 22px "IBM Plex Sans Thai", sans-serif';
      ctx.fillText('ห้อง สป13-302 · เวลาเรียน 07:00 - 18:00/19:00 น. (พัก 12:00-13:00)', 54, 154);

      items.forEach((course, idx) => {
        const y = headerHeight + idx * rowHeight;
        ctx.fillStyle = '#0e1219';
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
        ctx.lineWidth = 2;
        roundRect(ctx, 54, y, width - 108, rowHeight - 16, 20);
        ctx.fill();
        ctx.stroke();

        const teachers = resolveTeachersForCourse(course);
        const isPair = teachers.length > 1;
        const pSize = isPair ? 98 : 118;

        teachers.slice(0, 2).forEach((t, tIdx) => {
          const px = 76 + tIdx * (pSize + 10);
          const py = y + Math.round((rowHeight - 16 - pSize) / 2);
          const img = loadedImgs.get(getTeacherPortraitSrc(t));

          ctx.save();
          roundRect(ctx, px, py, pSize, pSize, 16);
          ctx.clip();
          if (img) {
            const scale = Math.max(pSize / img.naturalWidth, pSize / img.naturalHeight);
            const dw = img.naturalWidth * scale;
            const dh = img.naturalHeight * scale;
            ctx.drawImage(img, px + (pSize - dw) / 2, py, dw, dh);
          } else {
            ctx.fillStyle = '#1b2330';
            ctx.fillRect(px, py, pSize, pSize);
          }
          ctx.restore();

          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2.5;
          roundRect(ctx, px, py, pSize, pSize, 16);
          ctx.stroke();
        });

        const textX = isPair ? 76 + 2 * 98 + 26 : 216;
        ctx.fillStyle = '#fbbf24';
        ctx.font = '700 21px "JetBrains Mono", monospace';
        ctx.fillText(`${course.code} · ${course.cr} นก.`, textX, y + 40);

        ctx.fillStyle = '#f4f6fa';
        ctx.font = '700 27px "IBM Plex Sans Thai", sans-serif';
        ctx.fillText(course.name, textX, y + 74);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '500 21px "IBM Plex Sans Thai", sans-serif';
        ctx.fillText(course.teacher || '-', textX, y + 106);

        ctx.fillStyle = '#9aa5b8';
        ctx.font = '500 19px "IBM Plex Sans Thai", sans-serif';
        const timeText = course.start && course.end ? `${course.start}-${course.end} น.` : '';
        const roomText = course.room ? `ห้อง ${course.room}` : '';
        ctx.fillText(`${course.days || ''}  ${timeText}  ${roomText}`.trim(), textX, y + 135);
      });

      ctx.fillStyle = '#626d82';
      ctx.font = '500 18px "IBM Plex Sans Thai", sans-serif';
      ctx.fillText('สาขาวิชาเทคโนโลยีไฟฟ้า คณะวิทยาศาสตร์และเทคโนโลยี มรภ.ธนบุรี (สมุทรปราการ)', 54, height - 30);

      try {
        const url = canvas.toDataURL('image/png');
        triggerDownload(url, `timetable-ee69-${term.replace('/', '-')}.png`);
        showToast('บันทึกรูป PNG เรียบร้อย');
      } catch (err) {
        showToast('ไม่สามารถสร้างรูปได้เนื่องจากข้อจำกัดไฟล์รูปข้ามโดเมน');
      }
    }

    function exportBackupJson() {
      const payload = JSON.stringify({
        exportedAt: new Date().toISOString(),
        courses: state.courses,
        photos: state.photos
      }, null, 2);
      const blob = new Blob([payload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      triggerDownload(url, 'dru-ee69-g16-backup.json');
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      showToast('ดาวน์โหลดไฟล์สำรอง .json แล้ว');
    }

    function importBackupJson(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (Array.isArray(parsed.courses)) {
            const map = new Map(parsed.courses.map(c => [c.code, c]));
            state.courses = state.courses.map(c => map.has(c.code) ? { ...c, ...map.get(c.code) } : c);
          }
          if (parsed.photos && typeof parsed.photos === 'object') {
            state.photos = { ...state.photos, ...parsed.photos };
          }
          persist();
          render();
          showToast('กู้คืนข้อมูลจากไฟล์เรียบร้อย');
        } catch (e) {
          showToast('ไฟล์สำรองไม่ถูกต้อง');
        }
      };
      reader.readAsText(file);
    }

    function triggerDownload(href, filename) {
      const a = document.createElement('a');
      a.href = href;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function escapeHtmlAttr(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function setTab(tabName) {
      state.tab = tabName;
      document.querySelectorAll('[data-view]').forEach(el => {
        el.classList.toggle('hidden', el.dataset.view !== tabName);
      });
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
      });
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      if (state.tab === 'overview') renderOverview();
      else if (state.tab === 'plan') renderPlan();
      else if (state.tab === 'schedule') renderSchedule();
      else if (state.tab === 'teachers') renderTeachers();
    }

    document.addEventListener('click', e => {
      const tabBtn = e.target.closest('.nav-btn[data-tab]');
      if (tabBtn) {
        setTab(tabBtn.dataset.tab);
        return;
      }

      if (e.target.closest('[data-action="quick-timetable"]')) {
        setTab('schedule');
        return;
      }

      const statusTile = e.target.closest('[data-filter-status]');
      if (statusTile) {
        state.planStatus = statusTile.dataset.filterStatus;
        state.planTerm = 'ALL';
        setTab('plan');
        return;
      }

      const jumpTerm = e.target.closest('[data-jump-term]');
      if (jumpTerm) {
        state.planTerm = jumpTerm.dataset.jumpTerm;
        state.planStatus = 'ALL';
        setTab('plan');
        return;
      }

      const setTerm = e.target.closest('[data-set-term]');
      if (setTerm) {
        state.planTerm = setTerm.dataset.setTerm;
        renderPlan();
        return;
      }

      const setStatus = e.target.closest('[data-set-status]');
      if (setStatus) {
        state.planStatus = setStatus.dataset.setStatus;
        renderPlan();
        return;
      }

      const setSchedTerm = e.target.closest('[data-set-sched-term]');
      if (setSchedTerm) {
        state.scheduleTerm = setSchedTerm.dataset.setSchedTerm;
        renderSchedule();
        return;
      }

      const openCourse = e.target.closest('[data-open-course]');
      if (openCourse) {
        openCourseModal(openCourse.dataset.openCourse);
        return;
      }

      if (e.target.closest('[data-close-modal]') || e.target.id === 'modal-backdrop') {
        closeModal();
        return;
      }

      const pickStatus = e.target.closest('[data-pick-status]');
      if (pickStatus && state.editingCourseCode) {
        const course = state.courses.find(c => c.code === state.editingCourseCode);
        if (course) {
          course.status = pickStatus.dataset.pickStatus;
          if (course.status !== 'passed') course.grade = '';
          persist();
          openCourseModal(course.code);
          render();
        }
        return;
      }

      const pickGrade = e.target.closest('[data-pick-grade]');
      if (pickGrade && state.editingCourseCode) {
        const course = state.courses.find(c => c.code === state.editingCourseCode);
        if (course) {
          course.grade = course.grade === pickGrade.dataset.pickGrade ? '' : pickGrade.dataset.pickGrade;
          if (course.grade) course.status = 'passed';
          persist();
          openCourseModal(course.code);
          render();
        }
        return;
      }

      if (e.target.closest('[data-save-course]')) {
        saveCourseFromModal();
        return;
      }

      const pickPhoto = e.target.closest('[data-pick-photo]');
      if (pickPhoto) {
        state.pendingPhotoTeacherId = pickPhoto.dataset.pickPhoto;
        document.getElementById('photo-file-input').value = '';
        document.getElementById('photo-file-input').click();
        return;
      }

      const clearPhoto = e.target.closest('[data-clear-photo]');
      if (clearPhoto) {
        delete state.photos[clearPhoto.dataset.clearPhoto];
        persist();
        render();
        showToast('ลบรูปที่อัปโหลดแล้ว');
        return;
      }

      if (e.target.closest('[data-export-png]')) {
        exportSchedulePng();
        return;
      }

      if (e.target.closest('[data-export-json]')) {
        exportBackupJson();
        return;
      }

      if (e.target.closest('[data-import-json]')) {
        document.getElementById('backup-file-input').value = '';
        document.getElementById('backup-file-input').click();
        return;
      }

      if (e.target.closest('[data-download-icon]') && appIconUrl) {
        triggerDownload(appIconUrl, 'ee-sp69-16-icon.png');
        showToast('ดาวน์โหลดไอคอนแอปแล้ว');
      }
    });

    document.getElementById('photo-file-input').addEventListener('change', e => {
      handlePhotoFileSelected(e.target.files && e.target.files[0]);
    });

    document.getElementById('backup-file-input').addEventListener('change', e => {
      importBackupJson(e.target.files && e.target.files[0]);
    });

    buildAppIcon();
    hydrate();
    render();
    probeBundledFacultyPhotos();
  </script>
</body>
</html>
